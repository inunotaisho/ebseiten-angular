<nav class="navbar container-fluid navbar-dark navbar-expand-lg bg-custom" id="headNav nav-color" role="navigation">
  <a class="navbar-brand" routerLink="/">
    <span class="logotext">{{ 'Navbar-Brand' | translate}}</span>
  </a>
  <button type="button" class="navbar-toggler collapsed pull-right" (click)="isCollapsed = !isCollapsed"
    data-toggle="collapse" data-target="#navbarSupportedContent" aria-expanded="false">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div id="navbar" class="navbar-collapse collapse bg-custom" [collapse]="!isCollapsed" #collapse="bs-collapse">
    <ul class="nav navbar-nav ms-auto" id="navbarSupportedContent">
      <li class="nav-item" *ngFor="let p of appNavItems" [ngClass]="{'hidden': p.visible !== undefined && !p.visible}">
        <a class="mobile nav-link" [routerLink]="[p.url]" (click)="[p.loginStatus]">
          {{ p.title ?? '' | translate }}
          <img id="about-me" [src]="p.image" *ngIf="!!p.image" />
          <i class="fa fa-user fa-1x" *ngIf="!!p.icon" aria-hidden="true"></i>
        </a>
      </li>
      <!--
      <li class="nav-item" [ngClass]="{'hidden': !isUserLoggedIn()}">
        <a class="mobile nav-link" routerLink="/profile" routerLinkActive="active">
          <i class="fa fa-user fa-1x" aria-hidden="true"></i>
      </a>
      </li> -->
    </ul>
  </div>
</nav>
